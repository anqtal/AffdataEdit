name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Check required configuration
        id: configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "owner=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          for name in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE or UNITY_SERIAL in GitHub Secrets"; exit 1
          fi
      # Unity 6000.6 aborts (exit 134) with Docker's 64 MiB /dev/shm and is killed
      # (exit 137) about two seconds into startup when a cached Library is restored,
      # so builds start from a clean Library with 2 GB of shared memory.
      - name: Give Docker containers enough shared memory for Unity 6000.6
        run: |
          if [ -s /etc/docker/daemon.json ]; then config=$(sudo cat /etc/docker/daemon.json); else config='{}'; fi
          echo "$config" | jq '. + {"default-shm-size": "2G"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - name: Record memory usage during the Unity build
        run: |
          nohup bash -c 'while true; do date -u +%T; free -m | sed -n 2,3p; ps -eo pid,rss,comm --sort=-rss | sed -n 2,6p; sleep 1; done' > "$RUNNER_TEMP/memory.log" 2>&1 &
      - id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: WindowsCiBuild.Build
          buildsPath: Build
          buildName: Windows
          chownFilesTo: ${{ steps.configuration.outputs.owner }}
          versioning: None
          allowDirtyBuild: true
      - name: Show memory diagnostics after a failed Unity build
        if: failure() && steps.unity.conclusion == 'failure'
        run: |
          sudo dmesg -T | grep -iE 'killed process|out of memory|oom' | tail -n 20 || true
          tail -n 240 "$RUNNER_TEMP/memory.log" || true
      # The updater is published on its own; AffdataEdit keeps it up to date.
      - name: Get latest independent updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo anqtal/AffdataEdit-Updater --pattern AffdataEdit-Updater.exe --pattern SHA256SUMS --dir "$RUNNER_TEMP/updater"
          (cd "$RUNNER_TEMP/updater" && sha256sum --check --ignore-missing SHA256SUMS && rm SHA256SUMS)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ['R2_PUBLIC_URL'].rstrip('/') + '/windows/latest.json'
          Path('Build/Windows/updater-config.json').write_text(json.dumps({'manifestUrl': url}), encoding='utf-8')
          Path('Build/Windows/build-version.txt').write_text(os.environ['GITHUB_SHA'], encoding='utf-8')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publish file objects and update manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install boto3
          python Tools/Release/publish.py windows Build/Windows AffdataEdit.exe
          python Tools/Release/publish.py updater/windows "$RUNNER_TEMP/updater" AffdataEdit-Updater.exe

  build-macos:
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Check required configuration
        id: configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "owner=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          for name in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE or UNITY_SERIAL in GitHub Secrets"; exit 1
          fi
      - name: Give Docker containers enough shared memory for Unity 6000.6
        run: |
          if [ -s /etc/docker/daemon.json ]; then config=$(sudo cat /etc/docker/daemon.json); else config='{}'; fi
          echo "$config" | jq '. + {"default-shm-size": "2G"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneOSX
          buildMethod: MacCiBuild.Build
          buildsPath: Build
          buildName: macOS
          chownFilesTo: ${{ steps.configuration.outputs.owner }}
          versioning: None
          allowDirtyBuild: true
      - name: Get latest independent updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo anqtal/AffdataEdit-Updater --pattern AffdataEdit-Updater-macOS.zip --pattern SHA256SUMS --dir "$RUNNER_TEMP/download"
          (cd "$RUNNER_TEMP/download" && sha256sum --check --ignore-missing SHA256SUMS)
          unzip -q "$RUNNER_TEMP/download/AffdataEdit-Updater-macOS.zip" -d "$RUNNER_TEMP/updater"
          chmod 755 "$RUNNER_TEMP/updater/AffdataEdit-Updater"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ['R2_PUBLIC_URL'].rstrip('/') + '/macos/latest.json'
          Path('Build/macOS/updater-config.json').write_text(json.dumps({'manifestUrl': url}), encoding='utf-8')
          Path('Build/macOS/build-version.txt').write_text(os.environ['GITHUB_SHA'], encoding='utf-8')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publish file objects and update manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install boto3
          python Tools/Release/publish.py macos Build/macOS AffdataEdit.app/Contents/MacOS/AffdataEdit
          python Tools/Release/publish.py updater/macos "$RUNNER_TEMP/updater" AffdataEdit-Updater
