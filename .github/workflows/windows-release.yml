name: Windows build and R2 update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Check required configuration
        id: configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "owner=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          for name in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; exit 1; fi
          done
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE or UNITY_SERIAL in GitHub Secrets"; exit 1
          fi
      # Unity 6000.6 aborts (exit 134) with Docker's 64 MiB /dev/shm and is killed
      # (exit 137) about two seconds into startup when a cached Library is restored,
      # so builds start from a clean Library with 2 GB of shared memory.
      - name: Give Docker containers enough shared memory for Unity 6000.6
        run: |
          if [ -s /etc/docker/daemon.json ]; then config=$(sudo cat /etc/docker/daemon.json); else config='{}'; fi
          echo "$config" | jq '. + {"default-shm-size": "2G"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - name: Record memory usage during the Unity build
        run: |
          nohup bash -c 'while true; do date -u +%T; free -m | sed -n 2,3p; ps -eo pid,rss,comm --sort=-rss | sed -n 2,6p; sleep 1; done' > "$RUNNER_TEMP/memory.log" 2>&1 &
      - id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: WindowsCiBuild.Build
          buildsPath: Build
          buildName: Windows
          chownFilesTo: ${{ steps.configuration.outputs.owner }}
          versioning: None
          allowDirtyBuild: true
      - name: Show memory diagnostics after a failed Unity build
        if: failure() && steps.unity.conclusion == 'failure'
        run: |
          sudo dmesg -T | grep -iE 'killed process|out of memory|oom' | tail -n 20 || true
          tail -n 240 "$RUNNER_TEMP/memory.log" || true
      - name: Include latest independent updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo anqtal/AffdataEdit-Updater --pattern AffdataEdit-Updater.exe --pattern SHA256SUMS --dir "$RUNNER_TEMP/updater"
          (cd "$RUNNER_TEMP/updater" && sha256sum --check SHA256SUMS)
          cp "$RUNNER_TEMP/updater/AffdataEdit-Updater.exe" Build/Windows/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ['R2_PUBLIC_URL'].rstrip('/') + '/windows/latest.json'
          Path('Build/Windows/updater-config.json').write_text(json.dumps({'manifestUrl': url}), encoding='utf-8')
          Path('Build/Windows/build-version.txt').write_text(os.environ['GITHUB_SHA'], encoding='utf-8')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publish file objects and update manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install boto3
          python Tools/Release/publish.py
      - name: Publish Windows release and remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          (cd Build/Windows && zip -qr "$RUNNER_TEMP/AffdataEdit-Windows-x64.zip" .)
          gh release create "$tag" "$RUNNER_TEMP/AffdataEdit-Windows-x64.zip" --target "$GITHUB_SHA" --title "AffdataEdit Windows $tag" --notes "Windows x64. Commit: $GITHUB_SHA. Launch AffdataEdit-Updater.exe to update." --latest
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          while IFS= read -r old; do
            if [ "$old" != "$tag" ]; then gh release delete "$old" --yes --cleanup-tag; fi
          done < "$RUNNER_TEMP/release-tags"

  # macOS is built for testing only: the app is uploaded as a workflow artifact and is not
  # published to R2 or a GitHub release.
  build-macos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Check required configuration
        id: configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "owner=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          for name in UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret: $name"; exit 1; fi
          done
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE or UNITY_SERIAL in GitHub Secrets"; exit 1
          fi
      - name: Give Docker containers enough shared memory for Unity 6000.6
        run: |
          if [ -s /etc/docker/daemon.json ]; then config=$(sudo cat /etc/docker/daemon.json); else config='{}'; fi
          echo "$config" | jq '. + {"default-shm-size": "2G"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneOSX
          buildMethod: MacCiBuild.Build
          buildsPath: Build
          buildName: macOS
          chownFilesTo: ${{ steps.configuration.outputs.owner }}
          versioning: None
          allowDirtyBuild: true
      # A tarball keeps the executable bits and symlinks inside the .app bundle.
      - name: Package macOS app
        run: tar -czf "$RUNNER_TEMP/AffdataEdit-macOS.tar.gz" -C Build/macOS AffdataEdit.app
      - uses: actions/upload-artifact@v4
        with:
          name: AffdataEdit-macOS
          path: ${{ runner.temp }}/AffdataEdit-macOS.tar.gz
          retention-days: 14
